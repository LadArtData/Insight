# Shared Flyway settings -- environment-specific values (URL, user,
# password) are passed at invocation time (CLI flags or FLYWAY_* env vars),
# never committed here. See ../INSIGHT_README.md for the local-Docker and
# real-ADB invocations.
#
# sql/INSIGHT_06_ords_rest_module.sql and sql/ADMIN_reference_export.sql /
# INSIGHT_ADMIN_cleanup_old_objects.sql are intentionally NOT picked up --
# they don't match the V<version>__<description>.sql naming Flyway scans
# for here. INSIGHT_06 registers ORDS metadata under ADMIN against a real
# ORDS-enabled environment (not a DDL migration, and not runnable against
# the local Docker container, which has no ORDS); the ADMIN_* scripts are
# one-off helpers, not part of the deploy sequence.
flyway.locations=filesystem:.
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.table=flyway_schema_history
