server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies the AI Follow-Up chat to the chat-proxy service (see
    # docker-compose.yml) so the browser never needs -- or could ever
    # safely hold -- the OCI credentials that service uses to call OCI
    # Generative AI.
    #
    # "chat-proxy" resolves only via Docker's embedded DNS inside
    # docker-compose. Standalone images use nginx.standalone.conf instead;
    # see that file for how to enable the chat proxy outside compose.
    location /api/chat {
        proxy_pass http://chat-proxy:5001/chat;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 10k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
