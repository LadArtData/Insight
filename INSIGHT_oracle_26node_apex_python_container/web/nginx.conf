server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies the AI Follow-Up chat to the chat-proxy service (see
    # docker-compose.yml) so the browser never needs -- or could ever
    # safely hold -- the OCI credentials that service uses to call OCI
    # Generative AI. "chat-proxy" resolves via Docker's embedded DNS
    # within docker-compose's network; a standalone/combined deployment
    # (web/Dockerfile or the root Dockerfile, outside docker-compose)
    # needs either a matching reachable hostname for the chat-proxy
    # container or this location adjusted to point at wherever that
    # service actually runs -- not solved here, since only the
    # docker-compose path is testable in this environment.
    location /api/chat {
        proxy_pass http://chat-proxy:5001/chat;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 10k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
