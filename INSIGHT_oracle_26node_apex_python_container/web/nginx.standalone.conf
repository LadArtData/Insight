# nginx config for the STANDALONE images (web/Dockerfile and the combined
# root Dockerfile) -- i.e. anything deployed outside docker-compose, such
# as the OCI Container Instance.
#
# It has no /api/chat block, because nginx resolves upstream hostnames at
# config-parse time: an unresolvable upstream makes nginx exit at startup
# rather than return 502 at request time. The sibling nginx.conf proxies
# to the host "chat-proxy", which only resolves via Docker's embedded DNS
# inside docker-compose, so using that file in a standalone image stops
# the container from starting at all.
#
# To enable the chat proxy in a standalone deployment, add:
#
#   location /api/chat {
#       proxy_pass http://127.0.0.1:5001/chat;
#       proxy_set_header Host $host;
#       proxy_read_timeout 60s;
#       client_max_body_size 10k;
#   }
#
# Use a literal address rather than a hostname so that a proxy which is
# down returns 502 instead of blocking nginx startup. This also requires
# the proxy to run in the same image and to have credentials available in
# that environment; see INSIGHT_README.md.

server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
