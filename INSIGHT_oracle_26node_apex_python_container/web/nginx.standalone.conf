# nginx config for the STANDALONE images (web/Dockerfile and the combined
# root Dockerfile) -- i.e. anything deployed outside docker-compose, such
# as the OCI Container Instance.
#
# Deliberately has no /api/chat block. nginx resolves upstream hostnames
# at config-parse time, so the sibling nginx.conf's
# "proxy_pass http://chat-proxy:5001/chat" is fatal wherever no host named
# "chat-proxy" exists: nginx exits with
#   [emerg] host not found in upstream "chat-proxy"
# and the container dies on startup rather than degrading. That is exactly
# what happened to the deployed Container Instance on 2026-08-19.
#
# Omitting the block rather than pointing it at 127.0.0.1 is deliberate:
#   - the front end does not call /api/chat yet (nothing regresses), and
#   - INSIGHT_chat_proxy.py authenticates from ~/.oci/config, which a
#     Container Instance cannot mount, so the proxy could not work there
#     even if it were running.
#
# When the chat feature is wired up AND the proxy has a working auth path
# in that environment (OCI instance principals rather than a mounted
# config file), add the location block back here pointing at wherever the
# proxy actually listens. Prefer a literal 127.0.0.1 over a hostname so a
# proxy that is down returns 502 instead of preventing nginx from starting.
#
# docker-compose keeps using nginx.conf, where "chat-proxy" does resolve
# via Docker's embedded DNS.

server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
