version: "3.8"

# Local Oracle Database container for INSIGHT dev/test.
# This is a *local stand-in* for the real Oracle Autonomous Database the
# README describes (ADMIN-only login, ORDS/APEX already provisioned).
# ORDS and APEX are NOT included in this image -- sql/INSIGHT_06 (the ORDS
# REST module) will not run here. Use this container to develop/test the
# schema, package, and seed data, and to run the Python ingestion script
# locally. See ../INSIGHT_README.md for the full picture, including how to
# point everything at the real ADB instead.
#
# Usage:
#   cp .env.example .env      # then edit the password
#   docker compose up -d oracle-db
#   docker compose logs -f oracle-db     # watch first-boot init (~2-5 min)
#   docker compose --profile migrate run --rm flyway migrate
#
# Schema is no longer auto-applied on first boot (that was the old
# docker/initdb/ wrapper, now removed) -- Flyway is the one tracked way
# scripts get applied, for this container and the real ADB alike. The
# `flyway` service below only runs when explicitly invoked via `--profile
# migrate`, so a plain `docker compose up -d` just gives you an empty,
# healthy database.
#
# Once healthy, connect as: iteria_ai / <APP_USER_PASSWORD> @ localhost:1521/FREEPDB1
#
# insight-web (below) is a separate static-file server for ../web/index.html
# (a copy of INSIGHT_app.html) -- it does not talk to oracle-db or any
# backend; it's the same clickable, localStorage-backed UI described in
# ../INSIGHT_README.md, just reachable over HTTP on port 8000 instead of
# opened as a local file. Same content, no live data either way.

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: insight-oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in docker/.env}
      APP_USER: iteria_ai
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in docker/.env}
    ports:
      - "1521:1521"
    volumes:
      # Persist data across container restarts (survives `docker compose down`,
      # not `docker compose down -v`).
      - insight-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Applies sql/V*.sql via Flyway. Opt-in (`--profile migrate`) rather than
  # part of the default `up`, since re-running migrate isn't something you
  # want happening implicitly every time you start the stack.
  flyway:
    image: flyway/flyway:11
    container_name: insight-flyway
    profiles: ["migrate"]
    depends_on:
      oracle-db:
        condition: service_healthy
    volumes:
      - ../sql:/flyway/sql:ro
    command: >
      -url=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      -user=iteria_ai
      -password=${APP_USER_PASSWORD:?set APP_USER_PASSWORD in docker/.env}
      -locations=filesystem:/flyway/sql
      -sqlMigrationPrefix=V
      -sqlMigrationSeparator=__
      -sqlMigrationSuffixes=.sql
      migrate

  # Server-side proxy in front of OCI Generative AI for the AI Follow-Up
  # chat -- holds the OCI credentials (mounted from the host's real
  # ~/.oci, never baked into the image) so the browser never can. Started
  # by default alongside insight-web; if OCI_COMPARTMENT_ID/
  # OCI_GENAI_MODEL_ID aren't set, the container still starts (health
  # check passes -- /health doesn't touch OCI), it just returns 502 on
  # actual /chat calls until real credentials/config are supplied.
  chat-proxy:
    build:
      context: ../python
      dockerfile: Dockerfile.chat-proxy
    container_name: insight-chat-proxy
    restart: unless-stopped
    environment:
      OCI_CONFIG_PROFILE: ${OCI_CONFIG_PROFILE:-DEFAULT}
      OCI_COMPARTMENT_ID: ${OCI_COMPARTMENT_ID:-}
      OCI_GENAI_MODEL_ID: ${OCI_GENAI_MODEL_ID:-}
      OCI_GENAI_ENDPOINT: ${OCI_GENAI_ENDPOINT:-}
    volumes:
      # Real credentials live only on the host, mounted read-only -- see
      # ../INSIGHT_README.md for how to generate this file. Never
      # committed, never baked into the image.
      - ${OCI_CONFIG_DIR:-~/.oci}:/root/.oci:ro

  insight-web:
    image: nginx:alpine
    container_name: insight-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - chat-proxy
    volumes:
      - ../web/index.html:/usr/share/nginx/html/index.html:ro
      - ../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  insight-oracle-data:
