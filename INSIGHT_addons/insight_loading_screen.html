<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIGHT — Loading</title>
<style>
  :root {
    --navy-deep:   #0A1B33;
    --navy:        #0F2A4D;
    --navy-soft:   #1B3A63;
    --orange:      #FF6A1A;
    --orange-soft: #FFB088;
    --ink-light:   #F4F7FB;
    --ink-muted:   #8FA3BF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 38%, var(--navy) 0%, var(--navy-deep) 68%);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .screen {
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
  }
  .stack {
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    text-align: center;
  }

  /* ---- signature mark: rotating orange aperture around a navy tile ---- */
  .mark {
    position: relative;
    width: 116px; height: 116px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark::before {
    content: "";
    position: absolute; inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,106,26,0.16) 0%, rgba(255,106,26,0) 70%);
  }
  .tile {
    width: 92px; height: 92px; border-radius: 22px;
    background: linear-gradient(155deg, var(--navy-soft), var(--navy));
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 18px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
  }
  .tile svg { width: 40px; height: 40px; }

  .ring {
    position: absolute; inset: 0;
    z-index: 1;
  }
  .ring svg { width: 100%; height: 100%; animation: spin 1.6s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- wordmark ---- */
  .wordmark {
    font-size: 1.9rem; font-weight: 800; letter-spacing: 0.14em;
    color: var(--ink-light); margin: 0;
  }
  .wordmark span { color: var(--orange); }
  .tagline {
    margin: 0; font-size: 0.82rem; letter-spacing: 0.04em;
    color: var(--ink-muted); font-weight: 500;
  }

  /* ---- progress ---- */
  .progress-track {
    width: 220px; height: 5px; border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden; margin-top: 6px;
  }
  .progress-fill {
    height: 100%; width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, var(--orange-soft), var(--orange));
    animation: sweep 1.35s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(280%); }
  }

  .status {
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-muted); font-weight: 600;
    transition: opacity 0.35s ease;
  }

  .progress-track { transition: opacity 0.35s ease; }

  /* ---- ready state: loading elements fade out, button fades in ---- */
  .loading-only { transition: opacity 0.35s ease; }
  body.is-ready .loading-only {
    opacity: 0;
    pointer-events: none;
    position: absolute;
  }
  .ring svg { transition: opacity 0.4s ease; }
  body.is-ready .ring svg { animation: none; opacity: 0; }

  .enter-btn {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.45s ease 0.1s, transform 0.45s ease 0.1s, background 0.15s ease, box-shadow 0.15s ease;
    margin-top: 4px;
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--navy-deep);
    background: linear-gradient(180deg, var(--orange-soft), var(--orange));
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(255,106,26,0.28);
  }
  .enter-btn:hover { box-shadow: 0 12px 30px rgba(255,106,26,0.4); }
  .enter-btn:focus-visible { outline: 2px solid var(--ink-light); outline-offset: 3px; }
  .enter-btn:active { transform: translateY(1px); }

  body.is-ready .enter-btn {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring svg { animation: none; }
    .progress-fill { animation: none; width: 60%; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="stack">
    <div class="mark">
      <div class="ring">
        <!-- orange aperture arc, ~270deg, doubles as the spinner -->
        <svg viewBox="0 0 116 116" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="58" cy="58" r="50" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"
                  stroke-dasharray="235 314" />
          <circle cx="58" cy="8" r="4.5" fill="#FF6A1A" />
        </svg>
      </div>
      <div class="tile">
        <!-- simple geometric "insight" glyph: converging data lines to a focal point -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 30L16 18L23 24L34 10" stroke="#FF6A1A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="34" cy="10" r="3.4" fill="#FF6A1A"/>
          <circle cx="16" cy="18" r="2.2" fill="#F4F7FB" fill-opacity="0.55"/>
          <circle cx="23" cy="24" r="2.2" fill="#F4F7FB" fill-opacity="0.55"/>
          <circle cx="6" cy="30" r="2.2" fill="#F4F7FB" fill-opacity="0.55"/>
        </svg>
      </div>
    </div>

    <div>
      <p class="wordmark">IN<span>SIGHT</span></p>
      <p class="tagline">Oracle Fusion Discovery &amp; Configuration</p>
    </div>

    <div class="progress-track loading-only">
      <div class="progress-fill"></div>
    </div>
    <p class="status loading-only">Loading workspace…</p>

    <button type="button" class="enter-btn" id="enter-btn">Start Questionnaire</button>
  </div>
</div>

<script>
  // Swap in real readiness logic later (e.g. resolve once the questionnaire's
  // data/config has actually loaded) -- this timer just simulates that today.
  window.addEventListener("load", function () {
    setTimeout(function () {
      document.body.classList.add("is-ready");
      document.getElementById("enter-btn").focus();
    }, 1600);
  });

  document.getElementById("enter-btn").addEventListener("click", function () {
    // Point this at the actual questionnaire entry page when it exists.
    window.location.href = "questionnaire.html";
  });
</script>
</body>
</html>
