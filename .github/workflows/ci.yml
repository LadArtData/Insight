name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify INSIGHT_app.html and web/index.html are in sync
        run: diff -q INSIGHT_app.html INSIGHT_oracle_26node_apex_python_container/web/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: INSIGHT_oracle_26node_apex_python_container/web/package-lock.json

      - name: Front-end regression suite
        working-directory: INSIGHT_oracle_26node_apex_python_container/web
        run: |
          npm ci
          npm test

      - name: Verify question set matches questions/insight_questions.json
        working-directory: INSIGHT_oracle_26node_apex_python_container
        run: |
          node scripts/gen-js-questions.js --check
          node scripts/gen-sql-seed.js --check

      - name: Compile-check Python ingestion script
        run: python -m py_compile INSIGHT_oracle_26node_apex_python_container/python/INSIGHT_oracle_doc_ingestion.py

      - name: Compile-check container entrypoint
        run: python -m py_compile INSIGHT_oracle_26node_apex_python_container/docker-entrypoint.py

      # Only flask: the suite stubs the OCI client, so installing the full
      # SDK here would add a minute to every run to test nothing extra.
      - name: Chat proxy test suite
        working-directory: INSIGHT_oracle_26node_apex_python_container/python
        run: |
          pip install flask
          python -m unittest test_INSIGHT_chat_proxy

      # The /api/chat upstream port is written in two places that must
      # agree -- the nginx template and the entrypoint's constant. A
      # mismatch is a silent 502 that nothing else would catch.
      - name: Verify the chat proxy port matches in nginx and the entrypoint
        working-directory: INSIGHT_oracle_26node_apex_python_container
        run: |
          grep -q 'proxy_pass http://127.0.0.1:5001/chat;' web/nginx.combined.conf.template
          grep -q 'CHAT_PROXY_PORT = "5001"' docker-entrypoint.py

      - name: Validate docker-compose config
        working-directory: INSIGHT_oracle_26node_apex_python_container/docker
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Basic SQL sanity check (non-empty, matched BEGIN/END blocks)
        run: |
          for f in INSIGHT_oracle_26node_apex_python_container/sql/*.sql; do
            echo "checking $f"
            [ -s "$f" ] || { echo "$f is empty"; exit 1; }
          done
