name: Build and push Insight to OCIR

# Single parameterized workflow replacing the old build.yml /
# build-manual.yml / build-web.yml / build-combined.yml, which were three
# near-duplicates plus one variant, differing only in which
# context/Dockerfile/tags to build. Manual runs pick the target explicitly.
#
# Push-triggered runs build "combined" (bom.ocir.io/.../insight-app:latest)
# because that is the image actually deployed to the OCI Container
# Instance. Previously this trigger watched only python/** and defaulted to
# the "python" target, so editing the questionnaire front end rebuilt
# nothing -- and a python/** edit rebuilt an image that isn't deployed.
# The result was a deployed container silently stale against main.
#
# The path filter therefore covers everything baked into the combined
# image: web/ (index.html + nginx.conf), python/ (the ingestion script and
# its requirements, installed into the image), and the combined Dockerfile
# itself. Manual dispatch still reaches the python and web targets.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which image to build and push"
        type: choice
        options:
          - python
          - web
          - combined
        default: combined
  push:
    branches: [main]
    paths:
      - "INSIGHT_oracle_26node_apex_python_container/web/**"
      - "INSIGHT_oracle_26node_apex_python_container/python/**"
      - "INSIGHT_oracle_26node_apex_python_container/Dockerfile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Insight
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        run: |
          # OCIR wants <tenancy-namespace>/<username>. Accept either form.
          USER="${{ secrets.OCIR_USERNAME }}"
          if [ -z "$USER" ] || [ -z "${{ secrets.OCIR_PASSWORD }}" ]; then
            echo "OCIR_USERNAME / OCIR_PASSWORD secrets are missing"
            exit 1
          fi
          case "$USER" in
            */*) ;;
            *) USER="bmi3vxyqnzrv/$USER" ;;
          esac
          echo "Logging in to bom.ocir.io as $USER"
          echo "${{ secrets.OCIR_PASSWORD }}" | docker login bom.ocir.io \
            -u "$USER" --password-stdin

      - name: Set build parameters for the selected target
        id: params
        env:
          TARGET: ${{ github.event.inputs.target || 'combined' }}
        run: |
          case "$TARGET" in
            python)
              echo "context=INSIGHT_oracle_26node_apex_python_container/python" >> "$GITHUB_OUTPUT"
              echo "file=INSIGHT_oracle_26node_apex_python_container/python/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "tags<<EOF"
                echo "bom.ocir.io/bmi3vxyqnzrv/insight:amd64-insight"
                echo "bom.ocir.io/bmi3vxyqnzrv/insight/insight:latest"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            web)
              echo "context=INSIGHT_oracle_26node_apex_python_container/web" >> "$GITHUB_OUTPUT"
              echo "file=INSIGHT_oracle_26node_apex_python_container/web/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "tags=bom.ocir.io/bmi3vxyqnzrv/insight-web:latest" >> "$GITHUB_OUTPUT"
              ;;
            combined)
              echo "context=INSIGHT_oracle_26node_apex_python_container" >> "$GITHUB_OUTPUT"
              echo "file=INSIGHT_oracle_26node_apex_python_container/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "tags=bom.ocir.io/bmi3vxyqnzrv/insight-app:latest" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown target: $TARGET (expected python, web, or combined)" >&2
              exit 1
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.params.outputs.context }}
          file: ${{ steps.params.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.params.outputs.tags }}

      - name: Summary
        env:
          TARGET: ${{ github.event.inputs.target || 'combined' }}
          TAGS: ${{ steps.params.outputs.tags }}
        run: |
          echo "Target: $TARGET"
          echo "Pushed:"
          echo "$TAGS" | sed 's/^/  /'
          if [ "$TARGET" = "python" ]; then
            echo "Note: Insight's main product is SQL/APEX/ORDS under sql/ and apex/."
            echo "This image is only the optional Python doc-ingestion helper."
          fi
