name: Build and push Insight to OCIR (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Insight
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        run: |
          USER="${{ secrets.OCIR_USERNAME }}"
          if [ -z "$USER" ] || [ -z "${{ secrets.OCIR_PASSWORD }}" ]; then
            echo "OCIR_USERNAME / OCIR_PASSWORD secrets are missing"
            exit 1
          fi
          case "$USER" in
            */*) ;;
            *) USER="bmi3vxyqnzrv/$USER" ;;
          esac
          echo "Logging in to bom.ocir.io as $USER"
          echo "${{ secrets.OCIR_PASSWORD }}" | docker login bom.ocir.io \
            -u "$USER" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: INSIGHT_oracle_26node_apex_python_container/python
          file: INSIGHT_oracle_26node_apex_python_container/python/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            bom.ocir.io/bmi3vxyqnzrv/insight:amd64-insight
            bom.ocir.io/bmi3vxyqnzrv/insight/insight:latest

      - name: Summary
        run: echo "Pushed bom.ocir.io/bmi3vxyqnzrv/insight:amd64-insight"
